<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus Validator</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --card: #141a2b;
      --card-2: #1b2338;
      --accent: #3ddc97;
      --accent-2: #4f8cff;
      --danger: #ff4d6d;
      --text: #e8ecf8;
      --muted: #7d88a8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, #1d2a55 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, #0f3b33 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .ticket {
      background: linear-gradient(145deg, var(--card-2), var(--card));
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    .ticket.shake { animation: shake 0.45s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(61,220,151,0.12);
      color: var(--accent);
      margin-bottom: 18px;
    }
    .status-pill.off {
      background: rgba(255,77,109,0.12);
      color: var(--danger);
    }
    .status-pill::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }

    .price-label { font-size: 14px; color: var(--muted); }
    .price {
      font-size: 56px;
      font-weight: 700;
      margin: 4px 0 28px;
      letter-spacing: -1px;
    }
    .price span {
      font-size: 24px;
      color: var(--muted);
      margin-left: 4px;
    }

    /* ----- Значок бесконтактной оплаты ----- */
    .visual {
      min-height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nfc-view {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contactless {
      width: 150px;
      height: 150px;
      filter: drop-shadow(0 0 14px rgba(79,140,255,0.45));
      transition: filter 0.3s;
    }
    .contactless .wave {
      fill: none;
      stroke: var(--accent-2);
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0.25;
      animation: wave 1.8s infinite ease-in-out;
    }
    .contactless .w2 { animation-delay: 0.3s; }
    .contactless .w3 { animation-delay: 0.6s; }
    .contactless .dot { fill: var(--accent-2); }

    body.scanning .contactless { filter: drop-shadow(0 0 16px rgba(61,220,151,0.6)); }
    body.scanning .contactless .wave,
    body.scanning .contactless .dot { stroke: var(--accent); fill: var(--accent); }

    @keyframes wave {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 1; }
    }

    /* ----- Валидатор не активен ----- */
    .off-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .off-view svg {
      width: 150px;
      height: 150px;
      filter: drop-shadow(0 0 18px rgba(255,77,109,0.5));
    }
    .off-view .cross-line {
      stroke: var(--danger);
      stroke-width: 14;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
      animation: draw 0.5s ease forwards;
    }
    .off-view .cross-line.second { animation-delay: 0.25s; }
    .off-view .cross-ring {
      stroke: rgba(255,77,109,0.35);
      stroke-width: 4;
      fill: none;
    }
    .off-text {
      font-size: 22px;
      font-weight: 800;
      color: var(--danger);
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    body.is-off .nfc-view { display: none; }
    body.is-off .off-view { display: flex; }

    @keyframes draw { to { stroke-dashoffset: 0; } }

    .hint {
      font-size: 15px;
      color: var(--muted);
      min-height: 46px;
      line-height: 1.4;
      margin-top: 8px;
    }
    .hint.error { color: var(--danger); }

    /* ----- Анимация оплаты ----- */
    .paid {
      position: fixed;
      inset: 0;
      background: rgba(5,8,15,0.8);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      z-index: 20;
    }
    .paid.show { display: flex; animation: fade 0.25s ease; }

    .paid-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px rgba(61,220,151,0.6);
      animation: pop 0.5s cubic-bezier(.2,1.4,.4,1);
    }
    .paid-circle svg { width: 70px; height: 70px; }
    .paid-circle path {
      fill: none;
      stroke: #0b0f1a;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: draw 0.4s ease 0.35s forwards;
    }
    .paid-amount {
      font-size: 34px;
      font-weight: 700;
      color: var(--accent);
      opacity: 0;
      animation: rise 0.4s ease 0.6s forwards;
    }
    .paid-sub {
      font-size: 15px;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.4s ease 0.75s forwards;
    }

    @keyframes pop {
      0%   { transform: scale(0); }
      100% { transform: scale(1); }
    }
    @keyframes rise {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* ----- Админ-панель ----- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,8,15,0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .overlay.show { display: flex; animation: fade 0.25s ease; }

    .admin {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      animation: rise 0.3s ease;
      text-align: left;
    }
    .admin h2 { font-size: 20px; margin-bottom: 4px; }
    .admin .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .field input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input[type="number"]:focus { border-color: var(--accent-2); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-2);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 24px;
    }
    .toggle-row .title { font-size: 15px; }
    .toggle-row .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #2a3350;
      border-radius: 999px;
      transition: 0.25s;
      cursor: pointer;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 24px; height: 24px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.25s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(22px); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-2), #7b5cff);
      color: #fff;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .saved-msg {
      font-size: 13px;
      color: var(--accent);
      min-height: 18px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved-msg.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="app">
    <div class="logo">Bus Validator</div>

    <div class="ticket" id="ticket">
      <div id="statusPill" class="status-pill">Валидатор активен</div>

      <div class="price-label">Стоимость проезда</div>
      <div class="price"><span id="priceView">150</span><span>₽</span></div>

      <div class="visual">
        <div class="nfc-view">
          <svg class="contactless" viewBox="0 0 100 100" aria-hidden="true">
            <path class="wave w1" d="M38.3 37.7 A16 16 0 0 1 38.3 62.3"/>
            <path class="wave w2" d="M47.3 27 A30 30 0 0 1 47.3 73"/>
            <path class="wave w3" d="M56.3 16.3 A44 44 0 0 1 56.3 83.7"/>
            <circle class="dot" cx="28" cy="50" r="5"/>
          </svg>
        </div>

        <div class="off-view">
          <svg viewBox="0 0 150 150" aria-hidden="true">
            <circle class="cross-ring" cx="75" cy="75" r="68"/>
            <line class="cross-line" x1="45" y1="45" x2="105" y2="105"/>
            <line class="cross-line second" x1="105" y1="45" x2="45" y2="105"/>
          </svg>
          <div class="off-text">Валидатор<br>не активен</div>
        </div>
      </div>

      <div id="hint" class="hint">Приложите карту к метке</div>
    </div>
  </div>

  <!-- Анимация успешной оплаты -->
  <div class="paid" id="paidOverlay">
    <div class="paid-circle">
      <svg viewBox="0 0 70 70" aria-hidden="true">
        <path d="M18 36 L30 48 L53 23"/>
      </svg>
    </div>
    <div class="paid-amount" id="paidAmount">150 ₽</div>
    <div class="paid-sub">Проезд оплачен</div>
  </div>

  <!-- Админ-панель (открывается только админ-меткой) -->
  <div class="overlay" id="adminOverlay">
    <div class="admin">
      <h2>Настройки</h2>
      <p class="sub">Изменения применяются сразу после сохранения</p>

      <div class="field">
        <label for="priceInput">Стоимость проезда, ₽</label>
        <input type="number" id="priceInput" min="0" step="1">
      </div>

      <div class="toggle-row">
        <div>
          <div class="title">Валидатор</div>
          <div class="desc" id="toggleDesc">Работает</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="enabledInput">
          <span class="slider"></span>
        </label>
      </div>

      <button class="btn btn-primary" id="saveBtn">Сохранить</button>
      <button class="btn btn-ghost" id="closeAdminBtn">Закрыть</button>
      <div class="saved-msg" id="savedMsg">Сохранено ✓</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'busValidatorSettings';
    const DEFAULTS = { price: 150, enabled: true };
    const PAID_DURATION = 2200;

    const els = {
      ticket: document.getElementById('ticket'),
      pill: document.getElementById('statusPill'),
      priceView: document.getElementById('priceView'),
      hint: document.getElementById('hint'),
      paid: document.getElementById('paidOverlay'),
      paidAmount: document.getElementById('paidAmount'),
      overlay: document.getElementById('adminOverlay'),
      priceInput: document.getElementById('priceInput'),
      enabledInput: document.getElementById('enabledInput'),
      toggleDesc: document.getElementById('toggleDesc'),
      save: document.getElementById('saveBtn'),
      close: document.getElementById('closeAdminBtn'),
      savedMsg: document.getElementById('savedMsg'),
    };

    let settings = loadSettings();
    let scanning = false;
    let paidTimer = null;

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return { ...DEFAULTS, ...saved };
      } catch {
        return { ...DEFAULTS };
      }
    }

    function saveSettings() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    }

    function renderMain() {
      els.priceView.textContent = settings.price;
      els.pill.textContent = settings.enabled ? 'Валидатор активен' : 'Валидатор выключен';
      els.pill.classList.toggle('off', !settings.enabled);
      document.body.classList.toggle('is-off', !settings.enabled);
    }

    function setHint(text, type = '') {
      els.hint.textContent = text;
      els.hint.className = 'hint ' + type;
    }

    function shake() {
      els.ticket.classList.remove('shake');
      void els.ticket.offsetWidth;
      els.ticket.classList.add('shake');
    }

    function openAdmin() {
      els.priceInput.value = settings.price;
      els.enabledInput.checked = settings.enabled;
      updateToggleDesc();
      els.overlay.classList.add('show');
    }

    function closeAdmin() {
      els.overlay.classList.remove('show');
    }

    function updateToggleDesc() {
      els.toggleDesc.textContent = els.enabledInput.checked
        ? 'Принимает карты'
        : 'Оплата отключена';
    }

    els.enabledInput.addEventListener('change', updateToggleDesc);

    els.save.addEventListener('click', () => {
      const price = parseInt(els.priceInput.value, 10);
      if (isNaN(price) || price < 0) {
        els.priceInput.style.borderColor = 'var(--danger)';
        return;
      }
      els.priceInput.style.borderColor = '';
      settings.price = price;
      settings.enabled = els.enabledInput.checked;
      saveSettings();
      renderMain();

      els.savedMsg.classList.add('show');
      setTimeout(() => els.savedMsg.classList.remove('show'), 1500);
    });

    els.close.addEventListener('click', closeAdmin);
    els.overlay.addEventListener('click', e => {
      if (e.target === els.overlay) closeAdmin();
    });

    function showPaid() {
      els.paidAmount.textContent = settings.price + ' ₽';
      els.paid.classList.remove('show');
      void els.paid.offsetWidth;
      els.paid.classList.add('show');
      setHint('');

      clearTimeout(paidTimer);
      paidTimer = setTimeout(() => els.paid.classList.remove('show'), PAID_DURATION);
    }

    function showDisabled() {
      shake();
      setHint('Оплата сейчас недоступна', 'error');
    }

    async function startScan() {
      if (scanning) return;

      if (!('NDEFReader' in window)) {
        setHint('Web NFC не поддерживается. Откройте страницу в Chrome на Android', 'error');
        return;
      }

      try {
        const reader = new NDEFReader();
        await reader.scan();
        scanning = true;
        document.body.classList.add('scanning');
        setHint('Приложите карту к метке');

        reader.onreading = ({ message }) => {
          for (const record of message.records) {
            if (record.recordType !== 'text') continue;

            const text = new TextDecoder(record.encoding || 'utf-8')
              .decode(record.data)
              .trim()
              .toLowerCase();

            // Админ-метка работает всегда, даже если валидатор выключен
            if (text === 'админ') {
              openAdmin();
              return;
            }
          }

          if (!settings.enabled) {
            showDisabled();
            return;
          }
          showPaid();
        };

        reader.onreadingerror = () => {
          setHint('Не удалось прочитать метку. Попробуйте ещё раз', 'error');
        };
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          // Браузер требует нажатия, чтобы включить NFC
          setHint('Нажмите на экран, чтобы включить считыватель', 'error');
          document.addEventListener('click', startScan, { once: true });
        } else {
          setHint('Ошибка: ' + err.message, 'error');
        }
      }
    }

    renderMain();
    // Запускаем считыватель сразу при открытии страницы
    startScan();
  </script>
</body>
</html>
